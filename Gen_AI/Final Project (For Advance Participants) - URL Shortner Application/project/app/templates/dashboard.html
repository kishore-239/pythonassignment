{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-8">

        <div class="card shadow-sm mb-4">
            <div class="card-body">

                <h4 class="card-title mb-3 text-center">
                    Shorten a URL
                </h4>

                <form method="post">
                    <div class="mb-3">
                        <input
                            name="url"
                            class="form-control"
                            placeholder="Enter URL (https://...)"
                        >
                    </div>
                    <div class="d-grid">
                        <button class="btn btn-primary">
                            Shorten URL
                        </button>
                    </div>
                </form>

            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">

                <h5 class="mb-3">Your Shortened URLs</h5>

                {% if urls %}
                    <ul class="list-group">
                        {% for u in urls %}
                            <li class="list-group-item">
                                <div class="fw-bold">
                                    {{ u.original_url }}
                                </div>
                                <a href="/{{ u.short_code }}" target="_blank">
                                    http://127.0.0.1:5000/{{ u.short_code }}
                                </a>
                            </li>
                        {% endfor %}
                    </ul>
                {% else %}
                    <p class="text-muted">
                        No URLs shortened yet.
                    </p>
                {% endif %}

            </div>
        </div>

        <div class="text-center mt-4">
            <a href="/logout" class="btn btn-outline-secondary">
                Logout
            </a>
        </div>

    </div>
</div>

{% endblock %}
